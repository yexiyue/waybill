[workspace]
resolver = "3"
members = ["crates/waybill", "crates/waybill-service-fs", "crates/waybill-service-gdrive", "crates/waybill-cli", "examples/consumer"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yexiyue/waybill"
rust-version = "1.88"

[workspace.dependencies]
waybill = { path = "crates/waybill" }
waybill-service-fs = { path = "crates/waybill-service-fs" }
waybill-service-gdrive = { path = "crates/waybill-service-gdrive" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.49", features = ["fs", "io-util", "sync", "time", "rt", "rt-multi-thread", "macros", "net", "signal"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json", "stream"] }
blake3 = "=1.8.2"
tempfile = "3"
fs2 = "0.4"
url = "=2.5.4"
oauth2 = { version = "5", default-features = false, features = ["reqwest"] }
clap = { version = "4.5", features = ["derive"] }
directories = "6"
# 按需开启所用特性；tree / virtual-list / router 暂无使用场景。
ratatui-kit = { version = "0.10", features = ["table", "atom"] }

# 原生 service 的依赖锁由仓库保存；核心不依赖 IO 或执行器。
[profile.release]
lto = "thin"

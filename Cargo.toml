[workspace]
resolver = "3"
members = ["crates/waybill", "crates/waybill-service-fs", "crates/waybill-service-gdrive", "crates/waybill-service-webdav", "crates/waybill-cli", "examples/consumer"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yexiyue/waybill"
rust-version = "1.88"

[workspace.dependencies]
waybill = { path = "crates/waybill" }
waybill-service-fs = { path = "crates/waybill-service-fs" }
waybill-service-gdrive = { path = "crates/waybill-service-gdrive" }
waybill-service-webdav = { path = "crates/waybill-service-webdav" }
quick-xml = { version = "0.42", features = ["serialize"] }
digest_auth = "0.3"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# 引擎内并发调度的执行器无关工具；不是执行器，核心仍不绑定运行时。
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1.49", features = ["fs", "io-util", "sync", "time", "rt", "rt-multi-thread", "macros", "net", "signal"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json", "stream"] }
blake3 = "=1.8.2"
# 下载校验需要与 Drive md5Checksum 对账的 MD5 实现。
md-5 = "0.10"
tempfile = "3"
soft-canonicalize = "0.5.6"
fs2 = "0.4"
url = "=2.5.4"
oauth2 = { version = "5", default-features = false, features = ["reqwest"] }
clap = { version = "4.5", features = ["derive"] }
directories = "6"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }

# 原生 service 的依赖锁由仓库保存；核心不依赖 IO 或执行器。
[profile.release]
lto = "thin"

[workspace]
resolver = "3"
members = ["crates/waybill", "crates/waybill-service-fs", "crates/waybill-service-gdrive", "examples/consumer"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yexiyue/waybill"
rust-version = "1.85"

[workspace.dependencies]
waybill = { path = "crates/waybill" }
waybill-service-fs = { path = "crates/waybill-service-fs" }
waybill-service-gdrive = { path = "crates/waybill-service-gdrive" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.49", features = ["fs", "io-util", "sync", "time", "rt", "macros", "net"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json", "stream"] }
blake3 = "=1.8.2"
tempfile = "3"
fs2 = "0.4"
url = "=2.5.4"

# 原生 service 的依赖锁由仓库保存；核心不依赖 IO 或执行器。
[profile.release]
lto = "thin"

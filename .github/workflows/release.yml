name: Publish crates
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to recover
        required: true
        type: string
      package:
        description: Only the crate whose version is still unpublished
        required: true
        type: choice
        options:
          - waybill-cli
          - waybill
          - waybill-service-fs
          - waybill-service-gdrive
          - waybill-service-opendal
          - waybill-service-webdav
permissions:
  contents: read
concurrency:
  group: crates-io-publish
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
  PUBLISH_PACKAGE: ${{ inputs.package }}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Validate tag, versions and release description
        run: python3 scripts/releases/notes.py check "$RELEASE_TAG" --require-tag
      - run: python3 -m unittest discover -s scripts/releases -p 'test_*.py'
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Verify publish packages
        run: |
          args=(--workspace)
          if [ -n "$PUBLISH_PACKAGE" ]; then
            args=(-p "$PUBLISH_PACKAGE")
          fi
          cargo publish "${args[@]}" --dry-run --locked --registry crates-io
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate version description and git log
        run: |
          python3 scripts/releases/notes.py check "$RELEASE_TAG" --require-tag
          python3 scripts/releases/notes.py render "$RELEASE_TAG" "$RUNNER_TEMP/release-notes.md"
          gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish workspace in dependency order
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "Missing repository secret CARGO_REGISTRY_TOKEN" >&2
            exit 1
          fi
          args=(--workspace)
          if [ -n "$PUBLISH_PACKAGE" ]; then
            args=(-p "$PUBLISH_PACKAGE")
          fi
          cargo publish "${args[@]}" --locked --registry crates-io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

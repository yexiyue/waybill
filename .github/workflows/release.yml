name: Publish crates
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: crates-io-publish
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Validate tag, versions and release description
        run: python3 scripts/releases/notes.py check "$RELEASE_TAG" --require-tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - run: python3 -m unittest discover -s scripts/releases -p 'test_*.py'
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo publish --workspace --dry-run --locked --registry crates-io
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate version description and git log
        run: |
          python3 scripts/releases/notes.py check "$RELEASE_TAG" --require-tag
          python3 scripts/releases/notes.py render "$RELEASE_TAG" "$RUNNER_TEMP/release-notes.md"
          gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
      - name: Publish workspace in dependency order
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "Missing repository secret CARGO_REGISTRY_TOKEN" >&2
            exit 1
          fi
          cargo publish --workspace --locked --registry crates-io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

name: CI
on:
  push:
    branches: [main]
  pull_request:
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
  msrv:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85.0
      # 库与 service 承诺 1.85；waybill-cli 是宿主工具，
      # 其 ratatui 0.30 依赖链要求 1.88，由上方 stable 覆盖。
      - run: cargo check --locked --all-targets -p waybill -p waybill-service-fs -p waybill-service-gdrive -p waybill-consumer-example
      - run: cargo test --locked -p waybill -p waybill-service-fs -p waybill-service-gdrive -p waybill-consumer-example
